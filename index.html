<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Inspiration</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f5eee6;color:#49382e;margin:0;padding:16px}
main{max-width:600px;margin:auto;background:white;padding:20px;border-radius:20px}
h1{text-align:center;font-size:28px}
h2{font-size:20px}
select,input{max-width:100%;margin:12px 0}
select{width:100%;padding:14px;border:1px solid #d5c8bb;border-radius:10px;background:#faf7f2;font-size:16px;color:#49382e}
img{display:block;width:auto;height:auto;max-width:100%;max-height:400px;margin:auto;border-radius:12px;cursor:crosshair}
[hidden]{display:none!important}
.palette{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:12px 0}
#colors{grid-template-columns:repeat(5,minmax(0,1fr))}
.swatch{min-width:0;text-align:center;font-size:11px;overflow-wrap:anywhere}
.chip{height:58px;border-radius:8px;border:1px solid #ddd}
button.swatch{background:none;border:0;padding:0;color:inherit;cursor:pointer}
.selected{display:flex;align-items:center;gap:14px;padding:12px;background:#f5eee6;border-radius:12px}
#sample{width:65px;height:65px;border-radius:10px;border:1px solid #ddd;flex-shrink:0}
.harmony{padding:14px;border:1px solid #e6ded5;border-radius:12px;margin:16px 0}
.advice{background:#f8f4ef;padding:12px;border-radius:8px;font-size:14px;line-height:1.6}
.visual{background:#faf8f5;border-radius:12px;margin:14px 0;overflow:hidden}
.visual svg{display:block;width:100%;height:auto}
.visual p{text-align:center;font-size:11px;margin:8px;color:#75675e}
small{color:#75675e}
</style>
</head>
<body>
<main>
<h1>Studio Inspiration</h1>
<p>Trouve les couleurs et les associations qui te correspondent.</p>
<label for="universe"><strong>Choisis ton univers</strong></label>
<select id="universe">
<option value="mode">Mode et vêtements</option>
<option value="deco">Décoration intérieure</option>
<option value="bijoux">Bijoux et accessoires</option>
<option value="beaute">Beauté et maquillage</option>
</select>
<h2>Importe ta photo</h2>
<input type="file" id="photo" accept="image/*">
<img id="preview" alt="Photo importée" hidden>
<p id="status">Choisis une photo.</p>
<section id="results" hidden>
<h2>Couleurs principales</h2>
<div id="colors" class="palette"></div>
<h2>Ta couleur sélectionnée</h2>
<div class="selected">
<div id="sample"></div>
<strong id="hexValue"></strong>
</div>
<h2>Harmonies et inspirations</h2>
<div id="harmonies"></div>
</section>
<small>Ta photo reste sur ton appareil. Les illustrations sont des exemples stylisés et non des photographies.</small>
</main>
<script>
const input=document.getElementById('photo');
const img=document.getElementById('preview');
const status=document.getElementById('status');
const colors=document.getElementById('colors');
const results=document.getElementById('results');
const universe=document.getElementById('universe');
const canvas=document.createElement('canvas');
const ctx=canvas.getContext('2d',{willReadFrequently:true});
let url;
let currentColor=null;
function hex(rgb){
return '#'+rgb.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
}
function rgbFromHex(h){
return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
}
function mix(a,b,t){
return hex(rgbFromHex(a).map((v,i)=>v*(1-t)+rgbFromHex(b)[i]*t));
}
function colorName(h){
const names={
'#f5f0e5':'écru',
'#b89a62':'doré',
'#252525':'noir',
'#d8a6b2':'rose poudré',
'#f5e9e2':'beige rosé',
'#bdb6ae':'gris taupe',
'#a5b39a':'vert sauge',
'#d5bfa5':'beige naturel',
'#faf7f0':'blanc cassé'
};
if(names[h.toLowerCase()])return names[h.toLowerCase()];
const [r,g,b]=rgbFromHex(h);
const max=Math.max(r,g,b),min=Math.min(r,g,b);
const delta=max-min;
const l=(max+min)/2;
if(max<45)return 'noir';
if(min>230)return 'blanc';
if(delta<25)return l<100?'gris foncé':l<175?'gris moyen':'gris clair';
if(delta<55&&r>=g&&r>=b)return l<145?'taupe foncé':'taupe clair';
let hue=0;
if(max===r)hue=60*((g-b)/delta%6);
else if(max===g)hue=60*((b-r)/delta+2);
else hue=60*((r-g)/delta+4);
hue=(hue+360)%360;
if(hue<15||hue>=345)return l<90?'bordeaux':l>180?'rose clair':'rouge';
if(hue<45)return l<110?'marron':l>180?'beige chaud':'terracotta';
if(hue<70)return l>180?'jaune pâle':'ocre';
if(hue<165)return l<100?'vert foncé':l>175?'vert clair':'vert';
if(hue<200)return 'bleu turquoise';
if(hue<260)return l<100?'bleu marine':l>175?'bleu clair':'bleu';
if(hue<300)return l>175?'lilas':'violet';
return l>175?'rose poudré':'rose';
}
function swatch(h,clickable){
const box=document.createElement(clickable?'button':'div');
box.className='swatch';
const chip=document.createElement('div');
chip.className='chip';
chip.style.background=h;
const label=document.createElement('p');
label.textContent=colorName(h);
const code=document.createElement('small');
code.textContent=h;
box.append(chip,label,code);
if(clickable){
box.type='button';
box.onclick=()=>selectColor(h);
}
return box;
}
function advice(list){
const [a,b,c,d]=list.map(colorName);
switch(universe.value){
case 'mode':
return 'Couleur principale : '+a+'. Haut : '+b+'. Accessoires : '+c+'. Chaussures : '+d+'. Tu peux inverser les couleurs selon la pièce que tu possèdes.';
case 'deco':
return 'Canapé ou meuble : '+a+'. Murs : '+b+'. Coussins et objets décoratifs : '+c+'. Tapis : '+d+'.';
case 'bijoux':
return 'Pièce principale : '+a+'. Perles ou pierres : '+b+'. Finitions : '+c+'. Accessoires complémentaires : '+d+'.';
case 'beaute':
return 'Rouge à lèvres : '+a+'. Fard à paupières : '+b+'. Blush : '+c+'. Accent : '+d+'. Cette palette est une inspiration à adapter à ta carnation et aux produits cosmétiques adaptés.';
}
}
function illustration(list){
const [a,b,c,d]=list;
let art='';
if(universe.value==='mode'){
art='<path d="M40 30 L75 15 L95 33 L115 15 L150 30 L174 75 L145 90 L130 66 L130 145 L60 145 L60 66 L45 90 L16 75 Z" fill="'+b+'" stroke="#776c63" stroke-width="1.3"/>'+
'<path d="M70 158 H130 L143 280 H108 L100 195 L92 280 H57 Z" fill="'+a+'" stroke="#776c63"/>'+
'<path d="M218 100 Q218 60 250 60 Q282 60 282 100" fill="none" stroke="'+c+'" stroke-width="9"/>'+
'<rect x="205" y="98" width="90" height="70" rx="12" fill="'+c+'" stroke="#776c63"/>'+
'<rect x="242" y="119" width="16" height="10" rx="2" fill="#c6a76c"/>'+
'<path d="M200 221 L225 220 L238 240 L274 250 Q286 262 270 266 H200 Z" fill="'+d+'" stroke="#776c63"/>'+
'<path d="M217 270 L242 269 L255 289 L291 299 Q303 311 287 315 H217 Z" fill="'+d+'" stroke="#776c63"/>';
}
if(universe.value==='deco'){
art='<rect x="0" y="0" width="340" height="245" fill="'+b+'"/>'+
'<rect x="0" y="245" width="340" height="95" fill="#ded1bf"/>'+
'<rect x="125" y="22" width="90" height="78" rx="2" fill="#faf7f0" stroke="#a78b69" stroke-width="5"/>'+
'<circle cx="170" cy="58" r="24" fill="'+c+'"/>'+
'<ellipse cx="170" cy="285" rx="145" ry="40" fill="'+d+'"/>'+
'<rect x="48" y="145" width="244" height="110" rx="18" fill="'+a+'" stroke="#776c63"/>'+
'<rect x="58" y="200" width="224" height="48" rx="12" fill="'+a+'" stroke="#776c63"/>'+
'<rect x="28" y="190" width="38" height="70" rx="13" fill="'+a+'" stroke="#776c63"/>'+
'<rect x="274" y="190" width="38" height="70" rx="13" fill="'+a+'" stroke="#776c63"/>'+
'<rect x="76" y="162" width="48" height="48" rx="8" fill="'+c+'" stroke="#776c63"/>'+
'<rect x="215" y="162" width="48" height="48" rx="8" fill="'+c+'" stroke="#776c63"/>'+
'<rect x="52" y="255" width="10" height="18" fill="#705a46"/>'+
'<rect x="278" y="255" width="10" height="18" fill="#705a46"/>';
}
if(universe.value==='bijoux'){
art='<path d="M45 25 Q30 150 115 185 Q200 150 185 25" fill="none" stroke="'+c+'" stroke-width="7"/>'+
'<path d="M115 165 L140 197 L115 230 L90 197 Z" fill="'+a+'" stroke="'+c+'" stroke-width="5"/>'+
'<circle cx="245" cy="60" r="17" fill="none" stroke="'+c+'" stroke-width="6"/>'+
'<ellipse cx="245" cy="98" rx="15" ry="23" fill="'+b+'" stroke="'+c+'" stroke-width="3"/>'+
'<circle cx="295" cy="60" r="17" fill="none" stroke="'+c+'" stroke-width="6"/>'+
'<ellipse cx="295" cy="98" rx="15" ry="23" fill="'+b+'" stroke="'+c+'" stroke-width="3"/>'+
'<ellipse cx="245" cy="220" rx="52" ry="38" fill="none" stroke="'+d+'" stroke-width="15"/>'+
'<circle cx="245" cy="181" r="13" fill="'+a+'" stroke="'+c+'" stroke-width="4"/>'+
'<circle cx="200" cy="200" r="10" fill="'+b+'"/>'+
'<circle cx="290" cy="200" r="10" fill="'+b+'"/>';
}
if(universe.value==='beaute'){
art='<rect x="35" y="145" width="55" height="125" rx="7" fill="#353535"/>'+
'<rect x="42" y="105" width="41" height="55" fill="#c8aa73"/>'+
'<path d="M48 105 V57 Q48 43 62 35 Q77 28 77 45 V105 Z" fill="'+a+'" stroke="#776c63"/>'+
'<rect x="125" y="30" width="185" height="110" rx="12" fill="#ded5c9" stroke="#a79a8d"/>'+
'<rect x="140" y="48" width="70" height="74" rx="7" fill="'+b+'" stroke="#a79a8d"/>'+
'<rect x="225" y="48" width="70" height="74" rx="7" fill="'+d+'" stroke="#a79a8d"/>'+
'<circle cx="220" cy="235" r="75" fill="#39332f"/>'+
'<circle cx="220" cy="235" r="62" fill="'+c+'" stroke="#b8a18a" stroke-width="3"/>';
}
const box=document.createElement('div');
box.className='visual';
box.innerHTML='<svg viewBox="0 0 340 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration de la palette">'+art+'</svg><p>Aperçu illustré de ton harmonie</p>';
return box;
}
function selectColor(h){
currentColor=h;
document.getElementById('sample').style.background=h;
document.getElementById('hexValue').textContent=colorName(h)+' — '+h;
const out=document.getElementById('harmonies');
out.replaceChildren();
const rgb=rgbFromHex(h);
const opposite=hex(rgb.map(v=>255-v));
const neutral=Math.max(...rgb)-Math.min(...rgb)<35;
const palettes=[
['Chic et élégant',[h,'#F5F0E5','#B89A62','#252525']],
['Doux et féminin',[h,neutral?'#D8A6B2':mix(h,'#FFFFFF',0.65),'#F5E9E2','#BDB6AE']],
['Naturel et moderne',[h,neutral?'#A5B39A':mix(opposite,'#B5B09A',0.65),'#D5BFA5','#FAF7F0']]
];
palettes.forEach(([name,list])=>{
const box=document.createElement('div');
box.className='harmony';
const title=document.createElement('strong');
title.textContent=name;
const row=document.createElement('div');
row.className='palette';
list.forEach(c=>row.appendChild(swatch(c,false)));
const tip=document.createElement('div');
tip.className='advice';
tip.textContent=advice(list);
box.append(title,row,illustration(list),tip);
out.appendChild(box);
});
}
universe.onchange=()=>{if(currentColor)selectColor(currentColor)};
input.onchange=function(){
if(!input.files[0])return;
currentColor=null;
results.hidden=true;
img.hidden=true;
status.textContent='Analyse en cours...';
if(url)URL.revokeObjectURL(url);
url=URL.createObjectURL(input.files[0]);
img.onload=function(){
try{
const scale=Math.min(1,800/Math.max(img.naturalWidth,img.naturalHeight));
canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
ctx.drawImage(img,0,0,canvas.width,canvas.height);
const data=ctx.getImageData(0,0,canvas.width,canvas.height).data;
const counts={};
for(let i=0;i<data.length;i+=16){
if(data[i+3]<128)continue;
const h=hex([data[i],data[i+1],data[i+2]].map(v=>Math.round(v/32)*32));
counts[h]=(counts[h]||0)+1;
}
const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);
colors.replaceChildren();
top.forEach(([h])=>colors.appendChild(swatch(h,true)));
img.hidden=false;
results.hidden=false;
selectColor(top.length?top[0][0]:'#808080');
status.textContent='Touche une couleur directement sur ta photo.';
}catch(e){
status.textContent='Analyse impossible. Essaie une autre photo.';
}
};
img.onerror=function(){status.textContent='Photo illisible. Essaie une autre image.'};
img.src=url;
};
img.addEventListener('click',function(e){
const r=img.getBoundingClientRect();
const x=Math.max(0,Math.min(canvas.width-1,Math.floor((e.clientX-r.left)/r.width*canvas.width)));
const y=Math.max(0,Math.min(canvas.height-1,Math.floor((e.clientY-r.top)/r.height*canvas.height)));
const data=ctx.getImageData(x,y,1,1).data;
selectColor(hex([data[0],data[1],data[2]]));
});
</script>
</body>
</html>

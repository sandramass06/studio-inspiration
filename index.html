<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Inspiration</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f5eee6;color:#49382e;padding:16px;margin:0}
main{max-width:550px;margin:auto;background:white;padding:20px;border-radius:18px}
h1{text-align:center;font-size:28px}
h2{font-size:20px}
input{max-width:100%;margin:18px 0}
img{display:block;width:auto;height:auto;max-width:100%;max-height:400px;margin:auto;border-radius:12px;cursor:crosshair}
[hidden]{display:none!important}
.palette{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:12px 0}
#colors{grid-template-columns:repeat(5,minmax(0,1fr))}
.swatch{min-width:0;text-align:center;font-size:10px}
.chip{height:58px;border-radius:8px;border:1px solid #ddd}
button.swatch{background:none;border:0;padding:0;color:inherit;cursor:pointer}
.selected{display:flex;align-items:center;gap:14px;padding:12px;background:#f5eee6;border-radius:12px}
#sample{width:65px;height:65px;border-radius:10px;border:1px solid #ddd}
.harmony{padding:12px;border:1px solid #e6ded5;border-radius:12px;margin:12px 0}
small{color:#75675e}
</style>
</head>
<body>
<main>
<h1>Studio Inspiration</h1>
<p>Importe une photo et découvre les couleurs qui s'accordent ensemble.</p>
<input type="file" id="photo" accept="image/*">
<img id="preview" alt="Photo importee" hidden>
<p id="status">Choisis une photo.</p>
<section id="results" hidden>
<h2>Couleurs principales</h2>
<div id="colors" class="palette"></div>
<h2>Ta couleur selectionnee</h2>
<div class="selected">
<div id="sample"></div>
<strong id="hexValue"></strong>
</div>
<h2>Harmonies de couleurs</h2>
<div id="harmonies"></div>
</section>
<small>Ta photo reste sur ton appareil. Les harmonies sont des suggestions.</small>
</main>
<script>
const input=document.getElementById('photo');
const img=document.getElementById('preview');
const status=document.getElementById('status');
const colors=document.getElementById('colors');
const results=document.getElementById('results');
const canvas=document.createElement('canvas');
const ctx=canvas.getContext('2d',{willReadFrequently:true});
let url;
function hex(rgb){
return '#'+rgb.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
}
function rgbFromHex(h){
return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
}
function mix(a,b,t){
return hex(rgbFromHex(a).map((v,i)=>v*(1-t)+rgbFromHex(b)[i]*t));
}
function swatch(h,clickable){
const box=document.createElement(clickable?'button':'div');
box.className='swatch';
const chip=document.createElement('div');
chip.className='chip';
chip.style.background=h;
const label=document.createElement('p');
label.textContent=h;
box.append(chip,label);
if(clickable){
box.type='button';
box.onclick=()=>selectColor(h);
}
return box;
}
function selectColor(h){
document.getElementById('sample').style.background=h;
document.getElementById('hexValue').textContent=h;
const out=document.getElementById('harmonies');
out.replaceChildren();
const rgb=rgbFromHex(h);
const opposite=hex(rgb.map(v=>255-v));
const neutral=Math.max(...rgb)-Math.min(...rgb)<35;
const palettes=[
['Chic et elegant',[h,'#F5F0E5','#B89A62','#252525']],
['Doux et feminin',[h,neutral?'#D8A6B2':mix(h,'#FFFFFF',0.65),'#F5E9E2','#BDB6AE']],
['Naturel et moderne',[h,neutral?'#A5B39A':mix(opposite,'#B5B09A',0.65),'#D5BFA5','#FAF7F0']]
];
palettes.forEach(([name,list])=>{
const box=document.createElement('div');
box.className='harmony';
const title=document.createElement('strong');
title.textContent=name;
const row=document.createElement('div');
row.className='palette';
list.forEach(c=>row.appendChild(swatch(c,false)));
box.append(title,row);
out.appendChild(box);
});
}
input.onchange=function(){
if(!input.files[0])return;
results.hidden=true;
img.hidden=true;
status.textContent='Analyse en cours...';
if(url)URL.revokeObjectURL(url);
url=URL.createObjectURL(input.files[0]);
img.onload=function(){
try{
const scale=Math.min(1,800/Math.max(img.naturalWidth,img.naturalHeight));
canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
ctx.drawImage(img,0,0,canvas.width,canvas.height);
const data=ctx.getImageData(0,0,canvas.width,canvas.height).data;
const counts={};
for(let i=0;i<data.length;i+=16){
if(data[i+3]<128)continue;
const h=hex([data[i],data[i+1],data[i+2]].map(v=>Math.round(v/32)*32));
counts[h]=(counts[h]||0)+1;
}
const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);
colors.replaceChildren();
top.forEach(([h])=>colors.appendChild(swatch(h,true)));
img.hidden=false;
results.hidden=false;
selectColor(top.length?top[0][0]:'#808080');
status.textContent='Touche une couleur directement sur ta photo.';
}catch(e){
status.textContent='Analyse impossible. Essaie une autre photo.';
}
};
img.onerror=function(){status.textContent='Photo illisible. Essaie une autre image.';};
img.src=url;
};
img.addEventListener('click',function(e){
const r=img.getBoundingClientRect();
const x=Math.max(0,Math.min(canvas.width-1,Math.floor((e.clientX-r.left)/r.width*canvas.width)));
const y=Math.max(0,Math.min(canvas.height-1,Math.floor((e.clientY-r.top)/r.height*canvas.height)));
const data=ctx.getImageData(x,y,1,1).data;
selectColor(hex([data[0],data[1],data[2]]));
});
</script>
</body>
</html>

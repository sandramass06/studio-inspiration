<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Inspiration</title>
<style>
body{font-family:Arial,sans-serif;background:#f5eee6;color:#49382e;padding:20px}
main{max-width:500px;margin:auto;background:white;padding:20px;border-radius:18px}
h1{text-align:center}
input{max-width:100%;margin:20px 0}
img{width:100%;max-height:350px;object-fit:contain;border-radius:12px}
#colors{display:flex;flex-wrap:wrap;gap:10px}
.swatch{flex:1;min-width:65px;text-align:center;font-size:12px}
.chip{height:65px;border-radius:8px;border:1px solid #ddd}
</style>
</head>
<body>
<main>
<h1>Studio Inspiration</h1>
<p>Découvre les couleurs de ta photo.</p>
<input type="file" id="photo" accept="image/*">
<img id="preview" hidden>
<p id="status">Choisis une photo.</p>
<h2>Couleurs principales</h2>
<div id="colors"></div>
</main>
<script>
const input=document.getElementById('photo');
const img=document.getElementById('preview');
const status=document.getElementById('status');
const colors=document.getElementById('colors');
let url;
input.onchange=function(){
if(!input.files[0])return;
if(url)URL.revokeObjectURL(url);
colors.innerHTML='';
status.textContent='Analyse en cours...';
url=URL.createObjectURL(input.files[0]);
img.onload=function(){
img.hidden=false;
const canvas=document.createElement('canvas');
canvas.width=100;
canvas.height=100;
const ctx=canvas.getContext('2d');
ctx.drawImage(img,0,0,100,100);
const data=ctx.getImageData(0,0,100,100).data;
const counts={};
for(let i=0;i<data.length;i+=4){
if(data[i+3]<128)continue;
const rgb=[data[i],data[i+1],data[i+2]].map(v=>Math.min(255,Math.round(v/32)*32));
const hex='#'+rgb.map(v=>v.toString(16).padStart(2,'0')).join('');
counts[hex]=(counts[hex]||0)+1;
}
Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5).forEach(([hex])=>{
const box=document.createElement('div');
box.className='swatch';
box.innerHTML='<div class="chip" style="background:'+hex+'"></div><p>'+hex+'</p>';
colors.appendChild(box);
});
status.textContent='Analyse terminée !';
};
img.onerror=function(){status.textContent='Photo illisible. Essaie une autre image.';};
img.src=url;
};
</script>
</body>
</html>
